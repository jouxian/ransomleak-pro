name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]" "pyinstaller>=6.10"

      - name: Run tests
        run: python -m pytest

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean RansomLeakPro.spec

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\RansomLeakPro.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  RansomLeakPro.exe" | Set-Content -Encoding ascii ".\dist\RansomLeakPro.exe.sha256"
          Get-Content ".\dist\RansomLeakPro.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RansomLeakPro-Windows
          path: |
            dist/RansomLeakPro.exe
            dist/RansomLeakPro.exe.sha256
          if-no-files-found: error

      - name: Attach files to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "RansomLeak Pro $tag" --generate-notes
          }
          gh release upload $tag ".\dist\RansomLeakPro.exe" ".\dist\RansomLeakPro.exe.sha256" --clobber
