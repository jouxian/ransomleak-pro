[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomleak-pro"
version = "9.0.0"
description = "Read-only forensic archive inventory tool for authorized local datasets."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "jouxian"}]
keywords = ["forensics", "archive", "zip", "rar", "7z", "incident-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PySide6>=6.7",
  "rarfile>=4.2",
  "py7zr>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ransomleak-pro = "ransomleak_pro.__main__:main"

[project.urls]
Homepage = "https://github.com/jouxian/ransomleak-pro"
Repository = "https://github.com/jouxian/ransomleak-pro"
Issues = "https://github.com/jouxian/ransomleak-pro/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
